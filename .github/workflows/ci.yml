name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint (errors only, whole repo)
        run: npx eslint . --quiet
      - name: Unit tests
        run: npx vitest run
      - name: Conventions on the PR diff (guard, undo, secrets, routes)
        if: github.event_name == 'pull_request'
        run: node scripts/verify.mjs --base origin/${{ github.base_ref }}
      - name: Build
        timeout-minutes: 15
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
